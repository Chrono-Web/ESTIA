name: estia

services:
  core-api:
    build:
      context: ../..
      dockerfile: apps/core-api/Dockerfile
    environment:
      ESTIA_DATA_DIR: /data
      ESTIA_HOST: 0.0.0.0
      ESTIA_LOG_LEVEL: "${ESTIA_LOG_LEVEL:-info}"
      ESTIA_PORT: "${ESTIA_PORT:-3000}"
    ports:
      - "${ESTIA_BIND_ADDRESS:-127.0.0.1}:${ESTIA_HOST_PORT:-3000}:${ESTIA_PORT:-3000}"
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Database and instance identity. Losing this volume means losing the
      # identity that members pinned on first contact (ADR 0003).
      - estia-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.ESTIA_PORT || '3000') + '/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  estia-data:

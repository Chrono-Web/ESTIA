name: estia

services:
  core-api:
    build:
      context: ../..
      dockerfile: apps/core-api/Dockerfile
    environment:
      ESTIA_DATA_DIR: /data
      ESTIA_HOST: 0.0.0.0
      ESTIA_LOG_LEVEL: "${ESTIA_LOG_LEVEL:-info}"
      ESTIA_PORT: "${ESTIA_PORT:-3000}"
      # Ogni variabile che l'istanza legge va elencata qui: `--env-file` serve a
      # sostituire i valori in questo file, non a passarli dentro al container.
      # Un limite scritto nel `.env` e non ripetuto qui sarebbe una
      # configurazione ignorata in silenzio, che è peggio di una non offerta.
      ESTIA_MEDIA_MAX_BYTES: "${ESTIA_MEDIA_MAX_BYTES:-5242880}"
      ESTIA_MEDIA_MAX_PIXELS: "${ESTIA_MEDIA_MAX_PIXELS:-12000000}"
      ESTIA_MEDIA_QUOTA_BYTES: "${ESTIA_MEDIA_QUOTA_BYTES:-268435456}"
      # Backup automatici. Vuote: nessun backup, e l'istanza lo dice nei log.
      # Qui va SOLO la chiave pubblica: e' cio' che impedisce all'istanza di
      # rileggere i propri archivi (ADR 0013).
      ESTIA_BACKUP_DIR: "${ESTIA_BACKUP_DIR:-}"
      ESTIA_BACKUP_PUBLIC_KEY: "${ESTIA_BACKUP_PUBLIC_KEY:-}"
      ESTIA_BACKUP_INTERVAL_HOURS: "${ESTIA_BACKUP_INTERVAL_HOURS:-24}"
      ESTIA_BACKUP_KEEP: "${ESTIA_BACKUP_KEEP:-7}"
      # Che cosa dichiara l'amministratore sulla cifratura del volume: passphrase,
      # automatic o none. L'istanza verifica cio' che puo' e segnala le
      # contraddizioni (ADR 0007). Vuota significa «non dichiarata», mai «none».
      ESTIA_AT_REST_ENCRYPTION: "${ESTIA_AT_REST_ENCRYPTION:-}"
    ports:
      - "${ESTIA_BIND_ADDRESS:-127.0.0.1}:${ESTIA_HOST_PORT:-3000}:${ESTIA_PORT:-3000}"
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Database and instance identity. Losing this volume means losing the
      # identity that members pinned on first contact (ADR 0003).
      - estia-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Un tetto ai processi: e' l'unico limite che si puo' mettere senza sapere
    # quanti dati contiene l'istanza. Il processo e' uno solo con i suoi thread.
    pids_limit: 256
    # La memoria invece NON ha un default, ed e' una scelta.
    #
    # Un archivio viene cifrato tutto in memoria (ADR 0013), e misurando serve
    # circa SEI VOLTE la dimensione dei dati: 1,25 GB per 200 MB, 2,5 GB per
    # 400 MB. Un limite scelto a occhio non fa fallire il backup con un errore,
    # fa uccidere il processo dal kernel — e con `restart: unless-stopped`
    # l'istanza si riavvia e riprova, ogni volta.
    #
    # Percio' il default e' nessun limite. Chi vuole che ESTIA non possa
    # prendersi tutta la RAM del NAS lo imposta, tenendo conto di quel rapporto;
    # l'istanza guarda il proprio limite e avvisa in «Stato dell'istanza» quando
    # e' troppo basso per i dati che ha.
    mem_limit: "${ESTIA_MEMORY_LIMIT:-0}"
    cpus: "${ESTIA_CPU_LIMIT:-0}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.ESTIA_PORT || '3000') + '/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  estia-data:
